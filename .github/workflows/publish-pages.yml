name: Publish demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages-src (base64 chunks)
        uses: actions/checkout@v4
        with:
          ref: pages-src
          path: src

      - name: Checkout current gh-pages (for index.html)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Rebuild orphan gh-pages with decoded demo video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp pages/index.html site/index.html
          printf '\n' > site/.nojekyll
          cat src/pages-chunks/clearbill-demo-final.mp4.b64.* | base64 -d > site/clearbill-demo-final.mp4
          echo "4ff1463ca0db64fc8e18e7ee7e99dd31d1ff7e2ee7387fd87c4419e4128edee3  site/clearbill-demo-final.mp4" | sha256sum -c
          ls -lh site
          cd site
          git init
          git checkout --orphan gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Clearbill demo video on an orphan gh-pages branch"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages

      - name: Enable GitHub Pages on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pages" >/tmp/pages.json; then
            echo "Pages already exists; updating source to gh-pages /"
            gh api -X PUT "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f "build_type=legacy" \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          else
            echo "Creating Pages site from gh-pages /"
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f "build_type=legacy" \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          fi
